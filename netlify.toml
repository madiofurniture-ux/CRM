# Netlify configuration — MADIO CRM (React frontend)
#
# This branch contains the React + FastAPI application. The frontend is built
# from frontend/ and served as a single-page app; the FastAPI backend deploys
# separately (see render.yaml).
#
# NOTE: this file previously published the repo root and rewrote every path to
# the legacy single-file MADIO_CRM_v16.html. On this branch that deployed the
# old standalone app instead of this one, so it has been replaced.

[build]
  base = "frontend"
  command = "npm ci --no-audit --no-fund && npm run build"
  # Relative to `base`, not the repo root — Netlify prepends base to publish,
  # so "frontend/build" here resolved to frontend/frontend/build and failed
  # with "Deploy directory does not exist".
  publish = "build"

[build.environment]
  # Create React App treats warnings as errors on CI, which fails the build on
  # lint noise that does not affect the running app.
  CI = "false"
  NODE_VERSION = "20"

# ── API ────────────────────────────────────────────────────────────────────
# The frontend calls same-origin "/api" when REACT_APP_BACKEND_URL is unset
# (frontend/src/lib/api.js). Proxying here keeps the browser on one origin, so
# the backend needs no CORS configuration.
#
# STAGING BRANCH: this must point at the staging backend (its own database —
# server.py refuses to boot otherwise, see APP_ENV=staging check), never at
# production's madio-crm-api.onrender.com. Confirm the host in the Render
# dashboard once the madio-crm-api-staging service is live.
[[redirects]]
  from = "/api/*"
  to = "https://madio-crm-api-staging.onrender.com/api/:splat"
  status = 200
  force = true

# ── SPA fallback ───────────────────────────────────────────────────────────
# Must stay after the API rule, or it would swallow /api/* as well. React
# Router owns every other path, so unknown URLs serve index.html, not a 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ── Headers ────────────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Attendance takes a selfie and reads location at check-in.
    Permissions-Policy = "camera=(self), geolocation=(self)"

# Hashed bundles are immutable. index.html must never be cached, or users keep
# loading an old document that points at asset filenames the deploy removed.
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
