# Render.com blueprint — one free web service for the FastAPI backend.
# In Render: New → Blueprint → connect this repo → it reads this file.
# Set MONGO_URL and CORS_ORIGINS in the dashboard (they are secrets / per-deploy).
services:
  - type: web
    name: madio-crm-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements-prod.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/
    envVars:
      - key: MONGO_URL          # from MongoDB Atlas — set in dashboard, do NOT commit
        sync: false
      - key: DB_NAME
        value: madio_crm
      - key: JWT_SECRET         # Render generates a strong random value
        generateValue: true
      - key: CORS_ORIGINS       # e.g. https://crm.madiofurniture.com
        sync: false
      # File storage in SharePoint (docs/SHAREPOINT.md). Until these are set,
      # uploads go to the server disk, which Render wipes on every deploy.
      - key: STORAGE_BACKEND
        value: local            # change to sharepoint once the values below are set
      - key: SHAREPOINT_TENANT_ID
        sync: false
      - key: SHAREPOINT_CLIENT_ID
        sync: false
      - key: SHAREPOINT_CLIENT_SECRET
        sync: false
      - key: SHAREPOINT_SITE_URL
        value: https://madiofurniture.sharepoint.com/sites/MadioFurniture

  # Separate service, separate database — server.py refuses to boot if
  # APP_ENV=staging but DB_NAME doesn't contain "staging", so this can never
  # silently point at the production MONGO_URL above.
  - type: web
    name: madio-crm-api-staging
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements-prod.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: staging
      - key: MONGO_URL          # a DIFFERENT Atlas cluster/DB than production — set in dashboard
        sync: false
      - key: DB_NAME
        value: madio_crm_staging
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS       # the staging frontend's URL
        sync: false
