; MADIO Tally Connector settings. Copy this file to tally_connector.ini and fill it in.
; Keep tally_connector.ini private: it contains the connector key.
[connector]
; The CRM API address (the Render service), not the website.
crm_url = https://madio-crm-api.onrender.com
; From the CRM: Finance -> Tally -> "Generate connector key". Starts with mtc_
connector_key = mtc_paste-the-key-here
; Tally's XML server. TallyPrime: F1 Help -> Settings -> Connectivity ->
; "TallyPrime acts as: Both", port 9000. Tally.ERP 9: F12 -> Advanced Configuration.
tally_url = http://localhost:9000
; Company name exactly as shown in Tally. Leave blank to use the company open in Tally.
company = MADIO Furniture
; How many days of Sales and Receipt vouchers to re-send each time (re-sends are safe).
days_back = 45
; Used with --loop. With Windows Task Scheduler, schedule --once every 15 minutes instead.
interval_minutes = 15
; What to bring into the CRM.
kinds = stock_items,ledgers,sales_vouchers,receipts
; The ledger group holding your customers.
debtor_group = Sundry Debtors
