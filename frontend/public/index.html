<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#C85A32" />
        <meta name="description" content="MADIO Group CRM — furniture, premium acrylic plasters, doors &amp; windows." />
        <meta name="robots" content="noindex, nofollow" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet" />
        <title>MADIO CRM</title>

        <!-- Installable on phones straight from the browser: Chrome/Android shows
             "Install app", iOS Safari uses Share > Add to Home Screen. No app store. -->
        <link rel="manifest" href="/manifest.json" />
        <link rel="icon" href="/favicon.ico" sizes="any" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="default" />
        <meta name="apple-mobile-web-app-title" content="MADIO" />

        <!--
          Third-party telemetry deliberately REMOVED (2026-07-27).

          The scaffold shipped with PostHog (session replay, recordCrossOriginIframes:true)
          and assets.emergent.sh/scripts/emergent-main.js. This app renders real customer
          names, phone numbers, addresses and order values, so screen-recording it to an
          external service is a privacy and confidentiality problem — and it is not needed
          to run the business.

          If you ever want product analytics, add a self-hosted or contractually-covered
          tool here, and mask every field that carries customer data.
        -->
    </head>
    <body>
        <noscript>You need to enable JavaScript to run MADIO CRM.</noscript>
        <div id="root"></div>
    </body>
</html>
